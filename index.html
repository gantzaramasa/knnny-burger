<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#120c1f">
<meta name="description" content="借金1億円をモンスター肉バーガーで返す協力ゲーム">
<title>KnnnY BURGER</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap">
<style>
/* Layout: thin top bar (role, day clock, money, party, menu), a debt bar under it, one stage, bottom tabs in daytime.
   Night turns the stage into the restaurant canvas. Everything is pixel art on a late-night diner palette:
   deep violet night, mustard for money and actions, ketchup for danger, sky blue for the explorers. One committed dark look. */
:root {
  --bg: #1d1631; --panel: #2b2148; --panel2: #3a2d60; --edge: #120c1f; --line: #4b3d78;
  --cream: #fff7e8; --dim: #b6a9dc; --mute: #7d70a8;
  --mustard: #ffcc3e; --mustard-d: #d99a17; --ketchup: #ee4b3d; --ketchup-d: #a82c33; --lettuce: #79d45c; --sky: #5cc3ff; --wood: #a8663b;
  --f: 'DotGothic16', 'Hiragino Kaku Gothic ProN', 'Yu Gothic', 'MS Gothic', monospace;
  --top: 52px;
  --notch: polygon(4px 0, calc(100% - 4px) 0, 100% 4px, 100% calc(100% - 4px), calc(100% - 4px) 100%, 4px 100%, 0 calc(100% - 4px), 0 4px);
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { background: var(--bg); }
body { margin: 0; background: var(--bg); color: var(--cream); font: 16px/1.45 var(--f); padding-inline: 12px; padding-block: 0 84px; -webkit-text-size-adjust: 100%; -webkit-tap-highlight-color: transparent; }
body.night, body.dg { padding-block-end: 8px; }
body.night .banner, body.dg .banner { display: none; }
h1, h2, h3, p { margin: 0; font-weight: 400; }
b { font-weight: 400; }
button { font: inherit; color: inherit; }
img.px { image-rendering: pixelated; image-rendering: crisp-edges; display: inline-block; flex: none; vertical-align: middle; }
canvas { image-rendering: pixelated; }
.grow { flex: 1 1 0; min-width: 0; }
.dim { color: var(--dim); }
.center { justify-content: center; text-align: center; }
#app { max-width: 720px; margin-inline: auto; }
:focus-visible { outline: 3px solid var(--sky); outline-offset: 1px; }

/* pixel frame */
.pf { background: var(--panel); border: 3px solid var(--edge); clip-path: var(--notch); box-shadow: inset 0 3px 0 rgba(255,255,255,.07), inset 0 -3px 0 rgba(0,0,0,.25); }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 44px; padding: 0 14px; border: 3px solid var(--edge); clip-path: var(--notch); background: var(--panel2); color: var(--cream); cursor: pointer; box-shadow: inset 0 -3px 0 rgba(0,0,0,.3), inset 0 3px 0 rgba(255,255,255,.12); font-size: 16px; }
.btn:active:not(:disabled) { transform: translateY(2px); box-shadow: inset 0 -1px 0 rgba(0,0,0,.3); }
.btn.pri { background: var(--mustard); color: var(--edge); box-shadow: inset 0 -3px 0 var(--mustard-d), inset 0 3px 0 rgba(255,255,255,.45); }
.btn.ghost { background: transparent; color: var(--dim); box-shadow: none; }
.btn.danger { background: var(--ketchup); color: var(--cream); box-shadow: inset 0 -3px 0 var(--ketchup-d); }
.btn.sm { min-height: 36px; padding: 0 10px; font-size: 14px; }
.btn.big { min-height: 54px; font-size: 18px; }
.btn.block { width: 100%; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btns { display: flex; gap: 8px; }
.btns .btn { flex: 1; }
.chip { display: inline-flex; align-items: center; gap: 5px; min-height: 30px; padding: 0 9px; background: var(--panel2); border: 2px solid var(--edge); clip-path: var(--notch); font-size: 15px; font-variant-numeric: tabular-nums; }
.chip.sm { min-height: 22px; padding: 0 6px; font-size: 13px; }
.chip.bad { color: #ff9d92; }
.chip.auto { color: var(--lettuce); font-size: 13px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chips.big .chip { min-height: 40px; font-size: 18px; }
.empty { display: flex; align-items: center; gap: 8px; color: var(--mute); font-size: 14px; min-height: 36px; }
.statrow { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 16px; color: var(--dim); }
.statrow .st { display: inline-flex; align-items: center; gap: 6px; font-variant-numeric: tabular-nums; }
.statrow .st b { color: var(--cream); font-size: 18px; }
.statrow .st.good b { color: var(--lettuce); } .statrow .st.bad b { color: #ff9d92; }
.stack { display: grid; gap: 12px; }
.yen { display: inline-flex; align-items: center; gap: 4px; }

/* top bar */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; display: flex; align-items: center; gap: 6px; height: var(--top); margin-inline: -12px; padding-inline: 8px; background: var(--edge); border-bottom: 3px solid #08050f; }
.roles { display: flex; gap: 2px; }
.rb { width: 40px; height: 40px; display: grid; place-items: center; border: 2px solid transparent; background: transparent; cursor: pointer; clip-path: var(--notch); opacity: .45; padding: 0; }
.rb.on { opacity: 1; background: var(--panel2); border-color: var(--line); }
.rb:disabled { cursor: not-allowed; }
.clock { display: grid; gap: 3px; min-width: 64px; }
.clock .cl { display: flex; align-items: center; gap: 4px; font-size: 15px; line-height: 1; white-space: nowrap; }
.tbar { height: 6px; background: #000; border: 1px solid var(--line); }
.tbar i { display: block; height: 100%; background: var(--mustard); width: 100%; }
.tbar.night i { background: var(--sky); }
.money { display: flex; align-items: center; gap: 4px; font-size: 20px; color: var(--mustard); white-space: nowrap; font-variant-numeric: tabular-nums; }
.ibtn { display: inline-flex; align-items: center; justify-content: center; gap: 2px; min-width: 40px; height: 40px; padding: 0 4px; border: 0; background: transparent; cursor: pointer; }
.ibtn:hover, .ibtn.on { background: var(--panel); }
.avs { display: inline-flex; }
.avs img { margin-left: -6px; } .avs img:first-child { margin-left: 0; }
.debt { display: flex; align-items: center; gap: 8px; width: 100%; margin-top: 8px; padding: 4px 10px 4px 6px; min-height: 44px; cursor: pointer; text-align: left; color: var(--cream); }
.debt .dt { display: grid; gap: 3px; flex: 1; min-width: 0; }
.debt .dl { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; font-size: 15px; white-space: nowrap; }
.debt .dl b { color: var(--mustard); font-size: 18px; }
.debt .dl span { color: var(--dim); font-size: 13px; }
.debt .dl span.hot { color: #ff9d92; }
.dbar { height: 8px; background: #000; border: 1px solid var(--line); }
.dbar i { display: block; height: 100%; background: var(--lettuce); width: 0; }
.dbar.short i { background: var(--ketchup); }
.banner { display: flex; align-items: center; gap: 8px; margin-top: 8px; padding: 6px 10px; font-size: 13px; color: var(--dim); }

/* explorer town */
#town { margin-top: 12px; }
.ftiles { display: grid; gap: 10px; }
.ftile { --acc: var(--lettuce); display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 4px 14px; width: 100%; min-height: 86px; padding: 10px 14px; text-align: left; color: var(--cream); cursor: pointer; border: 3px solid var(--edge); clip-path: var(--notch); background: linear-gradient(90deg, var(--fc) 0 62%, var(--wc) 62%); box-shadow: inset 0 3px 0 rgba(255,255,255,.08), inset 0 -4px 0 rgba(0,0,0,.35); }
.ftile .fn { font-size: 34px; line-height: 1; color: var(--acc); text-shadow: 2px 2px 0 var(--edge); min-width: 2ch; }
.ftile .fm { display: grid; gap: 6px; min-width: 0; }
.ftile .fm b { font-size: 18px; text-shadow: 2px 2px 0 var(--edge); }
.ftile .mons { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 4px; }
.ftile .mons img.mon { width: 24px; height: 24px; }
.ftile .go { display: grid; justify-items: center; gap: 2px; min-width: 48px; }
.ftile .go small { font-size: 12px; color: var(--mustard); }
.ftile.lock { filter: grayscale(.7) brightness(.8); }
.ftile:disabled { cursor: not-allowed; opacity: .6; }

/* manager prep */
#prep { margin-top: 12px; display: grid; gap: 12px; }
.board { display: grid; gap: 10px; padding: 12px; background: #8b5a33; border: 3px solid var(--edge); clip-path: var(--notch); box-shadow: inset 0 3px 0 #b07444, inset 0 -4px 0 #5e3a1f; }
.bhead { display: flex; align-items: center; gap: 8px; font-size: 17px; text-shadow: 2px 2px 0 var(--edge); }
.raws { display: flex; flex-wrap: wrap; gap: 8px; }
.raw { display: grid; justify-items: center; gap: 2px; padding: 6px 8px 4px; min-width: 64px; background: #f3e1c0; color: var(--edge); border: 3px solid var(--edge); clip-path: var(--notch); cursor: pointer; font-size: 15px; }
.raw.on { background: var(--mustard); transform: translateY(-2px); }
.mg { position: relative; height: 58px; background: #f3e1c0; border: 3px solid var(--edge); overflow: hidden; touch-action: none; cursor: pointer; }
.mg.idle { opacity: .55; }
.mgz { position: absolute; top: 0; bottom: 0; }
.mgz.mid { background: rgba(121,212,92,.55); } .mgz.gold { background: var(--mustard); }
.mgc { position: absolute; top: 0; bottom: 0; width: 6px; margin-left: -3px; background: var(--edge); }
.mghint { position: absolute; inset: 0; display: grid; place-items: center; color: var(--edge); font-size: 15px; }
.pop { position: absolute; top: 4px; transform: translateX(-50%); display: inline-flex; align-items: center; gap: 2px; padding: 2px 6px; background: var(--edge); color: var(--cream); font-size: 16px; animation: up .7s steps(6) forwards; pointer-events: none; }
.pop.q2 { color: var(--mustard); } .pop.q0 { color: var(--dim); }
@keyframes up { to { transform: translate(-50%, -26px); opacity: 0; } }
.pslots { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.pslots.n3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.pslots.n4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.pslot { position: relative; display: grid; justify-items: center; align-content: center; gap: 2px; min-height: 84px; padding: 8px 4px 14px; background: #f3e1c0; color: var(--edge); border: 3px solid var(--edge); clip-path: var(--notch); cursor: pointer; font-size: 15px; touch-action: manipulation; user-select: none; -webkit-user-select: none; }
.pslot.empty { background: rgba(18,12,31,.25); border-style: dashed; border-color: rgba(18,12,31,.55); cursor: default; opacity: .8; }
.pslot.empty img { opacity: .5; }
.pslot .pbar { position: absolute; left: 6px; right: 6px; bottom: 5px; height: 6px; background: var(--edge); }
.pslot .pbar i { display: block; height: 100%; width: 0; background: var(--lettuce); }
.pslot.hit { animation: thump .12s steps(2); }
@keyframes thump { 50% { transform: translateY(2px) scale(.97); } }
button.empty.go { width: 100%; justify-content: center; border: 3px dashed rgba(18,12,31,.45); background: transparent; color: var(--edge); font: inherit; font-size: 15px; cursor: pointer; }
.raw.wait { opacity: .5; }
.nav button { position: relative; }
.nav .badge { position: absolute; top: 2px; right: calc(50% - 26px); min-width: 16px; height: 16px; padding: 0 3px; background: var(--lettuce); color: var(--edge); font-style: normal; font-size: 11px; line-height: 16px; }
.mcards { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.mcard { display: grid; justify-items: center; gap: 4px; padding: 14px 6px 12px; background: var(--panel2); border: 3px solid var(--edge); clip-path: var(--notch); cursor: pointer; color: var(--cream); font-size: 20px; box-shadow: inset 0 3px 0 rgba(255,255,255,.1), inset 0 -4px 0 rgba(0,0,0,.3); }
.mcard.solo { background: #3b5a8a; } .mcard.multi { background: #8a5a2a; }
.mcard small { font-size: 13px; color: var(--dim); }
.mcard .mav { display: flex; align-items: flex-end; gap: 2px; min-height: 48px; }
.mcard.lock { filter: grayscale(.8) brightness(.8); }
.mcard:disabled { opacity: .5; cursor: wait; }
.mcard:active:not(:disabled) { transform: translateY(2px); }
.sheet h2 .back { margin-right: 2px; color: var(--cream); font-size: 18px; }
.passl { display: flex; align-items: center; gap: 8px; padding: 6px 10px; background: var(--edge); font-size: 14px; color: var(--dim); }
.passl b { color: var(--mustard); font-size: 17px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.rcard .perk { display: inline-flex; align-items: center; gap: 3px; color: inherit; }
.btn .sv { margin-left: 6px; font-size: 13px; opacity: .8; }
.warn { margin: 0; color: #ff9d92; }
.lrows { display: grid; gap: 4px; }
.lrow { display: flex; align-items: center; gap: 10px; min-height: 44px; padding: 4px 10px; background: var(--edge); }
.lrow.me { box-shadow: inset 4px 0 0 var(--sky); }
.lrow b { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.lst { display: inline-flex; align-items: center; gap: 4px; flex: none; font-size: 14px; color: var(--mute); }
.lst.ok { color: var(--lettuce); } .lst.lead { color: var(--mustard); } .lst.play { color: var(--sky); }
.passl small { font-size: 13px; color: var(--dim); white-space: nowrap; }
.btn.ok { background: var(--lettuce); color: var(--edge); box-shadow: inset 0 -3px 0 #3c8f46, inset 0 3px 0 rgba(255,255,255,.4); }
.netl.center { justify-content: center; }
.pats { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; padding-top: 6px; border-top: 3px dashed rgba(18,12,31,.35); }
.pats > img:first-child { display: none; }
.crew { display: grid; gap: 6px; }
.mem { display: flex; align-items: center; gap: 10px; padding: 6px 8px; background: var(--panel); border: 3px solid var(--edge); clip-path: var(--notch); }
.mem .mn { flex: 1; min-width: 0; display: grid; gap: 2px; }
.mem .mn b { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mem .ms { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--dim); }
.hpb { width: 48px; height: 6px; background: #000; border: 1px solid var(--line); display: inline-block; }
.hpb i { display: block; height: 100%; background: var(--ketchup); }

/* upgrades */
#up { margin-top: 12px; display: grid; gap: 10px; }
.cats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
.cat { display: grid; justify-items: center; gap: 2px; padding: 6px 2px; background: var(--panel); border: 3px solid var(--edge); clip-path: var(--notch); cursor: pointer; font-size: 13px; color: var(--dim); }
.cat.on { background: var(--panel2); color: var(--cream); box-shadow: inset 0 -3px 0 var(--mustard); }
.utiles { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.utile { display: grid; gap: 7px; padding: 10px; background: var(--panel); border: 3px solid var(--edge); clip-path: var(--notch); box-shadow: inset 0 3px 0 rgba(255,255,255,.06); min-width: 0; }
.utile .uh { display: flex; align-items: center; justify-content: space-between; gap: 6px; min-height: 36px; }
.utile .fx { font-size: 17px; color: var(--cream); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.utile .un { display: flex; align-items: baseline; justify-content: space-between; gap: 6px; }
.utile .un b { font-size: 16px; }
.utile .lvl { font-size: 12px; color: var(--mute); }
.pips { display: flex; gap: 3px; }
.pips i { flex: 1; height: 5px; background: #000; }
.pips i.on { background: var(--mustard); }
.buy { display: inline-flex; align-items: center; justify-content: center; gap: 5px; min-height: 40px; border: 3px solid var(--edge); clip-path: var(--notch); background: var(--panel2); color: var(--dim); cursor: pointer; font-size: 16px; font-variant-numeric: tabular-nums; }
.buy.can { background: var(--mustard); color: var(--edge); box-shadow: inset 0 -3px 0 var(--mustard-d); }
.buy.can:active { transform: translateY(2px); }
.buy:disabled { cursor: not-allowed; }
.buy:disabled:not(.max) { opacity: .6; }
.buy.max { background: transparent; color: var(--mute); }

/* night */
#sc-night { margin-top: 8px; position: relative; }
.nhint { position: absolute; z-index: 3; left: 12px; right: 12px; top: 58px; display: flex; align-items: center; justify-content: center; gap: 6px; padding: 4px 8px; background: rgba(18,12,31,.88); border: 2px solid var(--line); font-size: 13px; color: var(--cream); pointer-events: none; }
.nhint .stp { display: inline-flex; align-items: center; gap: 3px; white-space: nowrap; }
.nhint .arr { color: var(--mustard); }
.nhud { display: flex; align-items: center; gap: 10px; padding: 4px 8px; min-height: 40px; font-size: 16px; }
.nhud .tbar { flex: 1; min-width: 40px; }
.nhud .ns { display: inline-flex; align-items: center; gap: 4px; white-space: nowrap; font-variant-numeric: tabular-nums; }
.nhud .ns.sales { color: var(--mustard); }
.nhud .ns.lost { color: #ff9d92; }
#ncv { display: block; width: 100%; margin-top: 6px; height: calc(100vh - var(--top) - 140px - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px)); min-height: 400px; max-height: 860px; touch-action: none; user-select: none; -webkit-user-select: none; border: 3px solid var(--edge); }
@supports (height: 100svh) { #ncv { height: calc(100svh - var(--top) - 140px - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px)); } }

/* dungeon */
.dgwrap { position: relative; margin-top: 8px; height: calc(100vh - var(--top) - 76px - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px)); min-height: 380px; max-height: 860px; overflow: hidden; background: #07060c; border: 3px solid var(--edge); touch-action: none; user-select: none; -webkit-user-select: none; }
@supports (height: 100svh) { .dgwrap { height: calc(100svh - var(--top) - 76px - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px)); } }
#dg { display: block; width: 100%; height: 100%; touch-action: none; }
.hud { position: absolute; pointer-events: none; }
.hud-tl { left: 10px; top: 10px; width: min(190px, 48%); display: grid; gap: 5px; }
.hprow { display: flex; align-items: center; gap: 8px; }
.hprow .fl { font-size: 22px; line-height: 1; text-shadow: 2px 2px 0 var(--edge); }
.bar { flex: 1; height: 10px; background: #000; border: 2px solid var(--edge); }
.bar i { display: block; height: 100%; width: 100%; background: var(--ketchup); }
.hudrow { display: flex; gap: 12px; font-size: 15px; text-shadow: 2px 2px 0 var(--edge); font-variant-numeric: tabular-nums; }
.hs { display: inline-flex; align-items: center; gap: 4px; }
.hs.full b { color: #ff9d92; }
.sunw { display: flex; align-items: center; gap: 6px; }
.sunw .tbar { flex: 1; height: 6px; }
.sunw.late .tbar i { background: var(--ketchup); }
.hud-tr { position: absolute; right: 10px; top: 10px; display: grid; justify-items: end; gap: 8px; width: min(138px, 38%); pointer-events: none; }
.mm { display: block; width: 100%; height: auto; border: 2px solid var(--edge); image-rendering: pixelated; }
.exitb { pointer-events: auto; display: inline-flex; align-items: center; gap: 6px; height: 38px; padding: 0 10px; border: 3px solid var(--edge); background: rgba(29,22,49,.85); cursor: pointer; font-size: 14px; color: var(--cream); }
.exitb.armed { background: var(--ketchup); }
.hud-msg { left: 0; right: 0; top: 104px; text-align: center; font-size: 18px; text-shadow: 2px 2px 0 var(--edge); padding-inline: 12px; }
.hint { position: absolute; left: 10px; bottom: 12px; display: grid; gap: 6px; justify-items: start; font-size: 14px; pointer-events: none; }
.hint .hs { padding: 3px 8px; background: rgba(18,12,31,.8); }
.keys { display: none; color: rgba(255,247,232,.55); font-size: 12px; }
@media (pointer: fine) { .keys { display: block; } }
.pad { position: absolute; right: 12px; bottom: 12px; display: grid; grid-template-columns: auto auto; align-items: end; gap: 10px; }
.padbtn { width: 60px; height: 60px; display: grid; place-items: center; border: 3px solid var(--edge); background: rgba(58,45,96,.85); cursor: pointer; touch-action: none; clip-path: var(--notch); padding: 0; }
.padbtn.big { width: 80px; height: 80px; background: rgba(238,75,61,.85); }
.padbtn.small { width: 46px; height: 46px; grid-column: 1; }
.padbtn:active { background: var(--mustard); }

/* tabs */
.nav { position: fixed; z-index: 15; left: 0; right: 0; bottom: 0; display: flex; justify-content: center; gap: 6px; padding: 6px 12px calc(6px + env(safe-area-inset-bottom, 0px)); background: var(--edge); border-top: 3px solid #08050f; }
.nav button { flex: 1; max-width: 160px; display: grid; justify-items: center; gap: 1px; padding: 4px 0; border: 0; background: transparent; color: var(--mute); cursor: pointer; font-size: 13px; }
.nav button.on { color: var(--cream); background: var(--panel); clip-path: var(--notch); box-shadow: inset 0 -3px 0 var(--mustard); }

/* party popover */
.pop2 { position: fixed; z-index: 40; top: calc(env(safe-area-inset-top, 0px) + var(--top) + 4px); right: 8px; width: min(340px, calc(100% - 16px)); display: grid; grid-template-columns: minmax(0, 1fr); gap: 10px; padding: 10px; }
.pop2 > * { min-width: 0; }
.prow { display: flex; align-items: center; gap: 8px; min-height: 36px; }
.prow b { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.prow .ms { display: flex; flex: none; align-items: center; gap: 6px; color: var(--dim); font-size: 13px; }
.qc { overflow: hidden; }
.phr { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
.qc { min-height: 42px; padding: 4px; border: 3px solid var(--edge); background: var(--panel2); clip-path: var(--notch); cursor: pointer; font-size: 14px; color: var(--cream); }
.qc:active { background: var(--mustard); color: var(--edge); }
.netl { display: flex; align-items: center; gap: 8px; color: var(--dim); font-size: 13px; }
.dot { width: 8px; height: 8px; background: var(--lettuce); display: inline-block; }
.dot.off { background: var(--ketchup); }

/* feed, toasts */
.feed { position: fixed; left: 12px; bottom: calc(76px + env(safe-area-inset-bottom, 0px)); max-width: min(360px, calc(100% - 24px)); display: grid; gap: 4px; pointer-events: none; z-index: 14; }
body.night .feed, body.dg .feed { bottom: calc(120px + env(safe-area-inset-bottom, 0px)); }
.fl2 { background: rgba(18,12,31,.92); padding: 4px 10px; font-size: 14px; width: fit-content; max-width: 100%; overflow-wrap: anywhere; display: flex; align-items: center; gap: 8px; border-left: 4px solid var(--c, var(--dim)); }
.toasts { position: fixed; left: 0; right: 0; top: calc(env(safe-area-inset-top, 0px) + var(--top) + 54px); display: grid; justify-items: center; gap: 6px; z-index: 60; pointer-events: none; padding-inline: 16px; }
.toast { background: var(--edge); border: 3px solid var(--line); padding: 6px 12px; font-size: 15px; max-width: 100%; display: flex; align-items: center; gap: 8px; }
.toast.good { border-color: var(--lettuce); } .toast.bad { border-color: var(--ketchup); }
.bigmsg { position: fixed; left: 0; right: 0; top: 34%; z-index: 55; text-align: center; pointer-events: none; font-size: 44px; color: var(--mustard); text-shadow: 4px 4px 0 var(--edge), -2px -2px 0 var(--edge); animation: pop 1.6s steps(8) forwards; }
@keyframes pop { 0% { transform: scale(.6); opacity: 0; } 15% { transform: scale(1.1); opacity: 1; } 75% { transform: scale(1); opacity: 1; } 100% { transform: scale(1); opacity: 0; } }

/* sheets */
.modal { position: fixed; inset: 0; z-index: 50; display: flex; align-items: flex-end; justify-content: center; overflow: auto; background: rgba(8,5,15,.72); }
.sheet { width: min(460px, 100%); margin: auto 0 0; display: grid; gap: 14px; padding: 18px 16px calc(18px + env(safe-area-inset-bottom, 0px)); background: var(--panel); border: 3px solid var(--edge); border-bottom: 0; box-shadow: inset 0 3px 0 rgba(255,255,255,.08); }
@media (min-width: 600px) { .modal { align-items: center; } .sheet { margin: auto; border-bottom: 3px solid var(--edge); clip-path: var(--notch); } }
.sheet h2 { display: flex; align-items: center; gap: 10px; font-size: 22px; }
.sheet h2.over { justify-content: center; font-size: 36px; color: var(--ketchup); text-shadow: 3px 3px 0 var(--edge); }
.sheet h2.win { justify-content: center; font-size: 36px; color: var(--mustard); text-shadow: 3px 3px 0 var(--edge); }
.scenebox { background: var(--edge); border: 3px solid var(--edge); }
.scenebox canvas.scene { display: block; width: 100%; height: auto; }
.story { font-size: 18px; line-height: 1.6; min-height: 3.2em; }
.title { font-size: 40px; line-height: 1; color: var(--mustard); text-shadow: 3px 3px 0 var(--edge); text-align: center; }
.title small { display: block; margin-top: 6px; font-size: 16px; color: var(--dim); text-shadow: none; }
.inp { width: 100%; font: inherit; font-size: 18px; color: var(--cream); background: var(--edge); border: 3px solid var(--line); padding: 8px 12px; min-height: 48px; }
.inrow { display: flex; gap: 8px; } .inrow .inp { flex: 1; min-width: 0; }
.rcards { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.rcard { display: grid; justify-items: center; gap: 6px; padding: 12px 6px 10px; background: var(--panel2); border: 3px solid var(--edge); clip-path: var(--notch); cursor: pointer; color: var(--dim); font-size: 18px; }
.rcard.on { background: var(--sky); color: var(--edge); }
.rcard.shop.on { background: var(--mustard); }
.rcard small { font-size: 12px; }
.duebox, .paid { display: flex; align-items: center; gap: 10px; padding: 8px; background: var(--edge); }
.duebox .grow b, .paid .grow b { font-size: 15px; color: var(--dim); }
.say { font-size: 16px; line-height: 1.5; }
.dueamt { display: grid; justify-items: end; } .dueamt b { color: var(--mustard); font-size: 20px; } .dueamt span { font-size: 13px; color: var(--dim); }
.stamp { padding: 2px 8px; border: 3px solid var(--ketchup); color: var(--ketchup); font-size: 18px; transform: rotate(-10deg); }
.sched { display: grid; gap: 2px; }
.srow { display: flex; align-items: center; gap: 10px; padding: 4px 8px; background: var(--edge); font-variant-numeric: tabular-nums; }
.srow .sd { width: 4.5em; color: var(--dim); font-size: 14px; }
.srow b { flex: 1; text-align: right; }
.srow.paid { opacity: .5; } .srow.cur { box-shadow: inset 4px 0 0 var(--mustard); }
.srow.tot { justify-content: space-between; background: transparent; }
.bigsale { display: flex; align-items: center; justify-content: center; gap: 10px; font-size: 38px; color: var(--mustard); text-shadow: 3px 3px 0 var(--edge); }
.best { display: flex; align-items: center; justify-content: center; gap: 8px; color: var(--dim); font-size: 14px; }
.fame { display: grid; gap: 4px; }
.frow { display: flex; align-items: center; gap: 12px; padding: 4px 8px; background: var(--edge); font-size: 14px; }
.frow b { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.frow .st { display: inline-flex; align-items: center; gap: 4px; }
.how { display: grid; gap: 8px; margin: 0; padding: 0; list-style: none; }
.how li { display: flex; align-items: center; gap: 10px; font-size: 15px; color: var(--dim); }
@media (prefers-reduced-motion: reduce) { .pop, .bigmsg { animation: none; } }

const PAL = {
  k: '#1b1428', K: '#3a2f52', w: '#fff7e8', W: '#e8d8bd', e: '#ffffff',
  s: '#f7cba3', S: '#dd9968', z: '#a8643e', Z: '#7a4529',
  r: '#ee4b3d', R: '#a82c33', o: '#f7932f', O: '#c45f1c', y: '#ffcc3e', Y: '#d99a17',
  g: '#79d45c', G: '#3c8f46', b: '#5cc3ff', B: '#2f6cc2', c: '#5fe2cf', C: '#2a9b8b',
  p: '#bf7af5', P: '#6d3ca8', m: '#ff88b2', M: '#c9517f', n: '#a8663b', N: '#6b3b22',
  t: '#f4b25f', T: '#c47c34', l: '#d3d5e8', L: '#8d90b1', d: '#545172', D: '#36334f', a: '#0b0911'
};
const SPR = {};
function defS(name, rows, pal) {
  const w = rows[0].length;
  for (let i = 0; i < rows.length; i++) if (rows[i].length !== w) throw new Error('sprite ' + name + ' row ' + i + ' len ' + rows[i].length + ' != ' + w);
  SPR[name] = { w, h: rows.length, rows, pal: pal || null };
}
const sprCache = new Map();
function sprCv(name, pal2) {
  const key = pal2 ? name + '|' + JSON.stringify(pal2) : name;
  let c = sprCache.get(key);
  if (c) return c;
  const sp = SPR[name];
  if (!sp) throw new Error('no sprite ' + name);
  c = document.createElement('canvas'); c.width = sp.w; c.height = sp.h;
  const x = c.getContext('2d'), img = x.createImageData(sp.w, sp.h);
  for (let j = 0; j < sp.h; j++) for (let i = 0; i < sp.w; i++) {
    const ch = sp.rows[j][i];
    if (ch === '.' || ch === ' ') continue;
    const col = (pal2 && pal2[ch]) || (sp.pal && sp.pal[ch]) || PAL[ch];
    if (!col) continue;
    const v = parseInt(col.slice(1), 16), o = (j * sp.w + i) * 4;
    img.data[o] = v >> 16; img.data[o + 1] = (v >> 8) & 255; img.data[o + 2] = v & 255; img.data[o + 3] = 255;
  }
  x.putImageData(img, 0, 0);
  sprCache.set(key, c);
  return c;
}
function drawS(ctx, name, x, y, s, flip, pal2) {
  const c = sprCv(name, pal2); s = s || 1;
  if (flip) { ctx.save(); ctx.translate(Math.round(x) + c.width * s, Math.round(y)); ctx.scale(-1, 1); ctx.drawImage(c, 0, 0, c.width * s, c.height * s); ctx.restore(); }
  else ctx.drawImage(c, Math.round(x), Math.round(y), c.width * s, c.height * s);
}
const urlCache = new Map();
function sprURL(name, pal2) {
  const key = pal2 ? name + '|' + JSON.stringify(pal2) : name;
  let u = urlCache.get(key);
  if (!u) { u = sprCv(name, pal2).toDataURL(); urlCache.set(key, u); }
  return u;
}
/* DOM image of a sprite at an integer scale */
function px(name, s, pal2, cls) {
  const sp = SPR[name], im = document.createElement('img');
  im.src = sprURL(name, pal2); im.alt = ''; im.draggable = false;
  im.className = 'px' + (cls ? ' ' + cls : '');
  im.width = sp.w * (s || 2); im.height = sp.h * (s || 2);
  return im;
}

function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function hashStr(s) { let x = 2166136261; for (let i = 0; i < s.length; i++) { x ^= s.charCodeAt(i); x = Math.imul(x, 16777619); } return x >>> 0; }
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : v; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) { } }
};
function h(tag, props, ...kids) {
  const e = document.createElement(tag);
  if (props) for (const k in props) {
    const v = props[k];
    if (v == null || v === false) continue;
    if (k === 'class') e.className = v;
    else if (k === 'style') e.style.cssText = v;
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else e.setAttribute(k, v === true ? '' : String(v));
  }
  for (const c of kids.flat(3)) { if (c == null || c === false) continue; e.append(c); }
  return e;
}

/* yen in compact Japanese units: ¥8,500 / ¥12.3万 / ¥1,234万 / ¥1.25億 */
function fmtY(n, noSign) {
  n = Math.round(n || 0);
  const neg = n < 0; n = Math.abs(n);
  let s;
  if (n < 10000) s = fmtN(n);
  else if (n < 1e8) { const v = n / 1e4; s = (v < 100 ? (Math.floor(v * 10) / 10).toString() : fmtN(Math.floor(v))) + '万'; }
  else { const v = n / 1e8; s = (Math.floor(v * 100) / 100).toString() + '億'; }
  return (neg ? '−' : '') + (noSign ? '' : '¥') + s;
}

const TS = 32, MW = 46, MH = 34;

function tryGen(seed, fl) {
  const rnd = mulberry32(hashStr(seed));
  const g = new Uint8Array(MW * MH).fill(1);
  const rooms = [];
  for (let i = 0; i < 90 && rooms.length < 9; i++) {
    const w = 5 + Math.floor(rnd() * 6), hh = 5 + Math.floor(rnd() * 5);

  for (const r of rooms) for (let y = r.y; y < r.y + r.h; y++) for (let x = r.x; x < r.x + r.w; x++) set(x, y);
  const hc = (x1, x2, y) => { for (let x = Math.min(x1, x2); x <= Math.max(x1, x2); x++) { set(x, y); set(x, y + 1); } };
  const vc = (y1, y2, x) => { for (let y = Math.min(y1, y2); y <= Math.max(y1, y2); y++) { set(x, y); set(x + 1, y); } };
  const link = (a, b) => { hc(a.cx, b.cx, a.cy); vc(a.cy, b.cy, b.cx); };
  for (let i = 0; i < rooms.length - 1; i++) link(rooms[i], rooms[i + 1]);
  for (let i = 0; i < rooms.length - 2; i++) if (rnd() < 0.35) link(rooms[i], rooms[i + 2]);

  const start = rooms[0], last = rooms[rooms.length - 1];
  const portal = { x: px(start.x + 1), y: px(start.cy) };
  const spawn = { x: px(start.cx + 1), y: px(start.cy) };
  const stairs = fl < 4 ? { x: px(last.x + last.w - 2), y: px(last.cy) } : null;
  const enemies = [], nodes = [];
  const inRoom = r => ({ x: px(r.x + 1 + Math.floor(rnd() * (r.w - 2))), y: px(r.y + 1 + Math.floor(rnd() * (r.h - 2))) });
  rooms.forEach((r, i) => {

}
function genFloor(seed, fl) {

}
const solid = (tx, ty) => tx < 0 || ty < 0 || tx >= MW || ty >= MH || D.m.g[ty * MW + tx] === 1;

function startRun(fl, carry) {

  if (fl > floorMax(s)) return;

  else P = { x: m.spawn.x, y: m.spawn.y, r: 9, hp: mhp, mhp, face: { x: 1, y: 0 }, atkT: 0, dashT: 0, dashCd: 0, inv: 0, flash: 0, bag: { meat: {}, pot: 0, ber: 0 }, holdP: 0, holdS: 0, walk: 0 };

/* update */
function dgUpdate(dt) {
  dt = Math.min(dt, 0.05); D.t += dt;
  const s = st();
  if (s.phase !== 'day') { endRun('dusk'); return; }
  const left = phaseLeft();
  if (left < 15 && !D.warned) { D.warned = true; dmsg('日没まで15秒！', 3); }
  let ix = keys.r - keys.l + joy.x, iy = keys.d - keys.u + joy.y;
  const L = Math.hypot(ix, iy);
  if (L > 1) { ix /= L; iy /= L; }
  if (L > 0.15) { const l = Math.hypot(ix, iy) || 1; P.face = { x: ix / l, y: iy / l }; P.walk += dt; } else P.walk = 0;
  P.atkT = Math.max(0, P.atkT - dt); P.dashCd = Math.max(0, P.dashCd - dt); P.inv = Math.max(0, P.inv - dt); P.flash = Math.max(0, P.flash - dt);

  moveEnt(P, vx * dt, vy * dt);
  if (atkHeld && P.atkT <= 0) doAttack();

  for (const e of D.enemies) {
    e.cd = Math.max(0, e.cd - dt); e.flash = Math.max(0, e.flash - dt);
    if (e.kb > 0) { e.kb -= dt; moveEnt(e, e.kx * dt, e.ky * dt); continue; }
    const dx = P.x - e.x, dy = P.y - e.y, d = Math.hypot(dx, dy) || 1;
    if (Math.abs(dx) > 2) e.face = dx > 0 ? 1 : -1;
    let sp = e.spd;
    if (e.hop) { e.hopT -= dt; if (e.hopT < 0) e.hopT = 1.2 + Math.random() * 0.6; sp = e.hopT < 0.35 ? e.spd * 3 : 0; }
    if (e.charge && d < 140 && d > 30) { e.chT -= dt; if (e.chT < -1.4) e.chT = 0.45; if (e.chT > 0) sp = e.spd * 3; }

  const dp = Math.hypot(P.x - D.m.portal.x, P.y - D.m.portal.y);
  if (dp < 22) { P.holdP += dt; if (P.holdP >= 0.9) { endRun('home'); return; } } else P.holdP = 0;
  if (D.m.stairs) {
    const ds = Math.hypot(P.x - D.m.stairs.x, P.y - D.m.stairs.y);
    if (ds < 22) {
      if (floorMax(s) >= D.fl + 1) { P.holdS += dt; if (P.holdS >= 0.9) { descend(); return; } }
      else if (D.t - D.stairT > 2.5) { D.stairT = D.t; dmsg('この先は未解放'); }
    } else P.holdS = 0;
  }
  for (let i = D.fx.length - 1; i >= 0; i--) { D.fx[i].t -= dt; if (D.fx[i].t <= 0) D.fx.splice(i, 1); }

/* main loop */
let lastT = performance.now(), bgT = performance.now();
function loop(t) {
  const dt = Math.min(0.1, (t - lastT) / 1000); lastT = t;
  hostAdvance(dt);
  pumpRS(t); pumpSK(t);
  phaseWatch();
  if (D.on && P) { if (!modalOpen()) dgUpdate(dt); if (D.on && P) drawDungeon(); }
  else if (curScene === 'night') drawNight(t / 1000);
  requestAnimationFrame(loop);
}
async function boot() {
  hydratePx();
  showScene();
  const first = store.get('kb_story', '') !== '1';
  const go = () => { store.set('kb_story', '1'); showTitle(); };
  const conn = connect().then(() => { banner(); introReady(); });
  if (first) showStory(go); else showTitle();
  await conn;
  setInterval(hostTick, 4000); setInterval(uiTick, 250);
  setInterval(() => { const n = performance.now(); if (document.hidden) hostAdvance(Math.min(1, (n - bgT) / 1000)); bgT = n; }, 500);
  addEventListener('pagehide', () => { flush(); });
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) { flush(); return; }
    // the screen lock is dropped while hidden; ask again so the phone stays awake during play
    if (app.started) try { navigator.wakeLock && navigator.wakeLock.request('screen').catch(() => { }); } catch (e) { }
